name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # CI - Install dependencies and run tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: self-hosted

    env:
      TEMP: D:\pip-tmp
      TMP: D:\pip-tmp
      PIP_CACHE_DIR: D:\pip-cache
      PYTHONUSERBASE: D:\python-packages

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Check Python installation and disk space
      # --------------------------------------------------------
      - name: Check Python and disk
        shell: powershell
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m site --user-base
          python -m site --user-site

          Write-Host "TEMP = $env:TEMP"
          Write-Host "TMP = $env:TMP"
          Write-Host "PIP_CACHE_DIR = $env:PIP_CACHE_DIR"
          Write-Host "PYTHONUSERBASE = $env:PYTHONUSERBASE"

          Get-PSDrive C,D

      # --------------------------------------------------------
      # Install Python dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        shell: powershell
        run: |
          python -m pip install --no-cache-dir --user -r requirements.txt

      # --------------------------------------------------------
      # Run automated tests
      # --------------------------------------------------------
      - name: Run tests
        shell: powershell
        run: |
          python -m pytest tests/


  # ============================================================
  # CD - Build and Push Docker Image
  # ============================================================
  docker:
    name: Build and Push Docker Image
    runs-on: self-hosted

    # Docker job runs only when the test job succeeds
    needs: test

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Verify Docker installation
      # --------------------------------------------------------
      - name: Check Docker
        shell: powershell
        run: |
          docker --version

      # --------------------------------------------------------
      # Login to Docker Hub using GitHub Secrets
      # --------------------------------------------------------
      - name: Login to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t viswapriya/industrial-predictive-maintenance:latest .

      # --------------------------------------------------------
      # Push Docker image to Docker Hub
      # --------------------------------------------------------
      - name: Push Docker image
        shell: powershell
        run: |
          docker push viswapriya/industrial-predictive-maintenance:latest

      # --------------------------------------------------------
      # Verify image exists locally
      # --------------------------------------------------------
      - name: Verify Docker image
        shell: powershell
        run: |
          docker images viswapriya/industrial-predictive-maintenance

