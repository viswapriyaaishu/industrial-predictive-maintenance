name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # CI - Install dependencies and run tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: self-hosted

    env:
      TEMP: D:\pip-tmp
      TMP: D:\pip-tmp
      PIP_CACHE_DIR: D:\pip-cache
      PYTHONUSERBASE: D:\python-packages

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Check Python and disk
      # --------------------------------------------------------
      - name: Check Python and disk
        shell: powershell
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m site --user-base
          python -m site --user-site

          Write-Host "TEMP = $env:TEMP"
          Write-Host "TMP = $env:TMP"
          Write-Host "PIP_CACHE_DIR = $env:PIP_CACHE_DIR"
          Write-Host "PYTHONUSERBASE = $env:PYTHONUSERBASE"

          Get-PSDrive C,D

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        shell: powershell
        run: |
          python -m pip install --no-cache-dir --user -r requirements.txt

      # --------------------------------------------------------
      # Run tests
      # --------------------------------------------------------
      - name: Run tests
        shell: powershell
        run: |
          python -m pytest tests/


  # ============================================================
  # CD - Build and Push Docker Image
  # ============================================================
  docker:
    name: Build and Push Docker Image
    runs-on: self-hosted

    needs: test

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Check Docker
      # --------------------------------------------------------
      - name: Check Docker
        shell: powershell
        run: |
          docker --version

      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t viswapriya/industrial-predictive-maintenance:latest ./backend

      # --------------------------------------------------------
      # Push Docker image
      # --------------------------------------------------------
      - name: Push Docker image
        shell: powershell
        run: |
          docker push viswapriya/industrial-predictive-maintenance:latest

      # --------------------------------------------------------
      # Verify Docker image
      # --------------------------------------------------------
      - name: Verify Docker image
        shell: powershell
        run: |
          docker images viswapriya/industrial-predictive-maintenance