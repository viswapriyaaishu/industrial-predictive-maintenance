name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # CI - Install dependencies and run tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: self-hosted

    env:
      TEMP: D:\pip-tmp
      TMP: D:\pip-tmp
      PIP_CACHE_DIR: D:\pip-cache
      PYTHONUSERBASE: D:\python-packages

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Check Python installation and disk space
      # --------------------------------------------------------
      - name: Check Python and disk
        shell: powershell
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m site --user-base
          python -m site --user-site

          Write-Host "TEMP = $env:TEMP"
          Write-Host "TMP = $env:TMP"
          Write-Host "PIP_CACHE_DIR = $env:PIP_CACHE_DIR"
          Write-Host "PYTHONUSERBASE = $env:PYTHONUSERBASE"

          Get-PSDrive C,D

      # --------------------------------------------------------
      # Install Python dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        shell: powershell
        run: |
          python -m pip install --no-cache-dir --user -r requirements.txt

      # --------------------------------------------------------
      # Run automated tests
      # --------------------------------------------------------
      - name: Run tests
        shell: powershell
        run: |
          python -m pytest tests/


  # ============================================================
  # CD - Build and Push Docker Image
  # ============================================================
  docker:
    name: Build and Push Docker Image
    runs-on: self-hosted

    # Docker job starts only if the test job succeeds
    needs: test

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Verify Docker installation
      # --------------------------------------------------------
      - name: Check Docker
        shell: powershell
        run: |
          docker --version

      # --------------------------------------------------------
      # Check Docker Hub credentials safely
      # --------------------------------------------------------
      # This step NEVER prints the actual username or token.
      # It only prints SHA-256 fingerprints for debugging.
      # --------------------------------------------------------
      - name: Check Docker Hub credential fingerprint
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |

          # ----------------------------------------------------
          # Check username
          # ----------------------------------------------------
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
              Write-Error "DOCKERHUB_USERNAME secret is missing or empty."
              exit 1
          }

          # ----------------------------------------------------
          # Check token
          # ----------------------------------------------------
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
              Write-Error "DOCKERHUB_TOKEN secret is missing or empty."
              exit 1
          }

          # ----------------------------------------------------
          # Generate username SHA-256 fingerprint
          # ----------------------------------------------------
          $usernameBytes = [System.Text.Encoding]::UTF8.GetBytes(
              $env:DOCKERHUB_USERNAME
          )

          $usernameHash = [System.Security.Cryptography.SHA256]::Create().ComputeHash(
              $usernameBytes
          )

          $usernameFingerprint = [BitConverter]::ToString(
              $usernameHash
          ).Replace("-", "")

          # ----------------------------------------------------
          # Generate token SHA-256 fingerprint
          # ----------------------------------------------------
          $tokenBytes = [System.Text.Encoding]::UTF8.GetBytes(
              $env:DOCKERHUB_TOKEN
          )

          $tokenHash = [System.Security.Cryptography.SHA256]::Create().ComputeHash(
              $tokenBytes
          )

          $tokenFingerprint = [BitConverter]::ToString(
              $tokenHash
          ).Replace("-", "")

          # ----------------------------------------------------
          # Display safe information
          # ----------------------------------------------------
          Write-Host "Docker Hub username length: $($env:DOCKERHUB_USERNAME.Length)"
          Write-Host "Docker Hub username fingerprint: $usernameFingerprint"

          Write-Host "Docker Hub token length: $($env:DOCKERHUB_TOKEN.Length)"
          Write-Host "Docker Hub token fingerprint: $tokenFingerprint"

          Write-Host "Both Docker Hub secrets are present."

      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t viswapriya/industrial-predictive-maintenance:latest .

      # --------------------------------------------------------
      # Push Docker image to Docker Hub
      # --------------------------------------------------------
      - name: Push Docker image
        shell: powershell
        run: |
          docker push viswapriya/industrial-predictive-maintenance:latest

      # --------------------------------------------------------
      # Verify image exists locally
      # --------------------------------------------------------
      - name: Verify Docker image
        shell: powershell
        run: |
          docker images viswapriya/industrial-predictive-maintenance